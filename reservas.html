  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Manrope:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="estilo.css?v=1">
  <link rel="stylesheet" href="reservas.css?v=2">

<body>
  <a class="saltar" href="#app">Ir al contenido</a>
  <header class="barra">
    <div class="envoltura barra__dentro">
      <a class="logo" href="index.html" aria-label="Buchona's Beauty Salon, volver al inicio">
        <span class="logo__nombre">Buchona's</span>
        <span class="logo__lugar">Beauty Salon, Irun</span>
      </a>
      <a class="btn btn--linea volver" href="index.html">Volver a la web</a>
      <div class="rv-cuenta" data-cuenta hidden>
        <span class="rv-cuenta__nombre" data-cuenta-nombre></span>
        <button class="btn btn--linea rv-boton-peq" type="button" data-accion="salir">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main id="principal">

    </section>
  </main>

  <div class="rv-aviso" role="status" aria-live="polite" data-aviso hidden></div>

  <dialog class="rv-dialogo" data-dialogo aria-labelledby="dialogo-titulo">
    <div data-dialogo-cuerpo></div>
  </dialog>

  <footer class="pie">
    <div class="envoltura">
      <div class="pie__arriba">
        <p class="pie__marca">Buchona's</p>
        <div class="pie__acciones">
          <a class="btn btn--claro" href="tel:+34943906915">Llamar</a>
          <a class="btn btn--claro" href="https://www.instagram.com/buchonasbs/" rel="noopener">Instagram</a>
        </div>
      </div>
      <div class="pie__abajo">
        <p><a href="legal.html">Aviso legal y privacidad</a></p>
        <p>Diseño y desarrollo web: FastCenter</p>
      </div>
    </div>
  </footer>
